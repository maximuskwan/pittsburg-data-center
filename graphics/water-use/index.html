  <!-- Section: "First to be curtailed". Numbers: data/water-use.csv -->
  <figure class="ph-root" data-graphic="water-use" aria-labelledby="hed" aria-describedby="desc">
    <h3 class="ph-hed" id="hed">Engineers’ estimate: 10 to 15 times the city manager’s</h3>
    <p class="ph-dek">Estimates of Phase 1’s daily water use range from 4,000 gallons to about 58,000. A 2019 agreement anticipated 5 million for the whole technology park.</p>
    <div class="ph-body" aria-hidden="true"></div>
    <p class="ph-sr-only ph-desc" id="desc">Bar charts of daily water use, shown at three scales. For Phase 1, the city manager says AVAIO expects to use 4,000 to 6,000 gallons a day and that the water would mostly go to landscaping. AVAIO’s engineers told Delta Diablo, the wastewater agency, about 58,000 gallons a day, and their February 2024 memo put 70% of that toward cooling the data halls. The golf course used roughly 270,000 gallons a day on average when it was green. A 2019 city agreement anticipated the whole technology park, all phases, would ultimately require about 5 million gallons a day.</p>
    <figcaption class="ph-foot"><p class="ph-note"><b>Note:</b> The golf course used about 300 acre-feet a year, shown here in gallons a day. The 2019 figure is what the agreement said the project would “ultimately require” across the whole park; the other project estimates are for Phase 1.</p><p class="ph-source"><b>Sources:</b> City Manager Darin Gale, interview with Scot Scoop; Kimley-Horn water demand memo to Delta Diablo, February 2024; city’s 2024 water supply assessment; 2019 Pittsburg Technology Park agreement (Operating Memorandum No. 1).</p><p class="ph-credit">Graphic by Maximus Kwan / Scot Scoop</p></figcaption>
  </figure>
