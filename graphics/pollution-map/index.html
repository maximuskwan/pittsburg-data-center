  <!-- Section: "From Black Diamond to data hub". Numbers: data/pollution-map.csv (npm run fetch:calenviroscreen) -->
  <figure class="ph-root" data-graphic="pollution-map" aria-labelledby="hed" aria-describedby="desc">
    <h3 class="ph-hed" id="hed">Nearby tracts rank among California’s most burdened</h3>
    <p class="ph-dek">Two Pittsburg tracts within 1.5 miles of the plan area, and one in neighboring Antioch, are in California’s top 10% on CalEnviroScreen, which weighs pollution and residents’ vulnerability to it.</p>
    <div class="ph-body" aria-hidden="true"></div>
    <p class="ph-sr-only ph-desc" id="desc">Map of census tracts around the former Delta View Golf Course in Pittsburg, labeled with their statewide CalEnviroScreen 5.0 percentiles. The plan area, just south of Highway 4, sits in tracts at the 44th and 46th percentiles. Two Pittsburg tracts to its north and east, 0.8 and 1.4 miles away, are at the 92nd percentile, among the 10% most burdened in California. So is a tract in neighboring Antioch, at the 90th.</p>
    <figcaption class="ph-foot"><p class="ph-note"><b>Note:</b> Numbers are each tract’s statewide CalEnviroScreen percentile. Only Contra Costa County tracts are shaded.</p><p class="ph-source"><b>Source:</b> CalEnviroScreen 5.0, California Office of Environmental Health Hazard Assessment, July 2026. Roads and water: U.S. Census Bureau. Plan area: City of Pittsburg.</p><p class="ph-credit">Graphic by Maximus Kwan / Scot Scoop</p></figcaption>
  </figure>
