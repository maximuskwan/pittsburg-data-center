    <h3 class="ph-hed" id="hed">Rewritten to advise the city manager, not the council</h3>
    <p class="ph-dek">Hours before the Aug. 3 meeting, a city consultant’s draft had the advisory committee advising the City Council. Replies typed into her email changed that.</p>
    <p class="ph-sr-only ph-desc" id="desc">The draft described the committee’s purpose as advising the City Council and its length of service as 4 months. Replies typed into the email said the members would advise the city manager, so the meetings would not be Brown Act meetings, and that 4 months could look like an attempt to finish before the new council. Sovinec suggested “over the next several months,” Gale wrote “That sounds good,” and the phrase went into the city’s news release.</p>
    <div class="ph-body"></div>
    <figcaption class="ph-foot"><p class="ph-note"><b>Note:</b> Replies are quoted as typed. Because the committee advises the city manager, the Brown Act, California’s open-meetings law, does not apply, Gale said.</p><p class="ph-source"><b>Source:</b> City of Pittsburg emails, Aug. 3, 2026.</p><p class="ph-credit">Graphic by Maximus Kwan / Scot Scoop</p></figcaption>
