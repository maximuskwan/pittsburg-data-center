  <figure class="ph-root" data-graphic="approvals-ahead" aria-labelledby="hed" aria-describedby="desc">
    <h3 class="ph-hed" id="hed">Two public votes remain, one for each part of the site</h3>
    <p class="ph-dek">Phase 1 still needs a public vote and two agencies’ approval. Phases 2 and 3, paused by an Oct. 26 moratorium, would end with one city official’s sign-off.</p>
    <div class="ph-body"></div>
    <p class="ph-sr-only ph-desc" id="desc">Two tracks of the approvals still ahead, with each approval marked by whether it is decided by a public vote. Phase 1, on 22 acres north of the canal, was approved in December 2025 and is exempt from the moratorium. It still needs three approvals, in any order: a public vote of the City Council, sitting as the Pittsburg Power Company board, on four agreements including the Energy Services Agreement; approval of the water system by Delta Diablo and the state, without a public vote; and permits for its 37 diesel generators from the Bay Area Air Quality Management District’s executive officer, also without a public vote. Phases 2 and 3, on 54 acres south of the canal, are under a 45-day moratorium adopted Oct. 26. A project there would then need, in order: federal environmental review, which the water district says the easement requires; an easement across the canal, voted on by the Contra Costa Water District’s elected board and approved by the U.S. Bureau of Reclamation; and approval of the buildings by the zoning administrator, a single city official, with no public vote. Under the specific plan, projects that fit it “shall not require additional environmental review” beyond effects peculiar to them. Gale says proposals would go to the Planning Commission and council instead, but the plan hasn’t been amended to require that.</p>
    <figcaption class="ph-foot"><p class="ph-note"><b>Note:</b> The Center for Biological Diversity, which agreed not to oppose Phase 1, can still oppose Phases 2 and 3.</p><p class="ph-source"><b>Sources:</b> City Manager Darin Gale; Delta Diablo; Bay Area Air Quality Management District; Contra Costa Water District letters; City of Pittsburg; Pittsburg Technology Park Specific Plan environmental report.</p><p class="ph-credit">Graphic by Maximus Kwan / Scot Scoop</p></figcaption>
  </figure>
