  <figure class="ph-root" data-graphic="water-priority" aria-labelledby="hed" aria-describedby="desc">
    <h3 class="ph-hed" id="hed">If recycled water runs short, the data center could fall back on drinking water</h3>
    <p class="ph-dek">AVAIO would be last in line for Delta Diablo’s recycled water. In a shortage, the settlement allows other water, and each backup can end at drinking water.</p>
    <div class="ph-body"></div>
    <p class="ph-sr-only ph-desc" id="desc">Who gets Delta Diablo’s recycled water first, and what the data center could use instead. First, two Calpine power plants have first rights. Second, other customers share what is left. Third, AVAIO’s data center would be the last customer to come online, so it “would also be the first to be curtailed,” Delta Diablo’s Nick Steiner wrote. Shortages come on a handful of the hottest summer days, when the data center’s cooling would use the most water. The settlement requires recycled water only “absent a disruption” in supply. In a shortage, the data center could turn to the site’s old storage tank, about 15 days’ supply and plumbed for drinking water too, or to the city’s 2019 promise to find water elsewhere, in this order: another district’s recycled water, raw water from the canal, then the city’s own drinking water supply. The records don’t say which would come first.</p>
    <figcaption class="ph-foot"><p class="ph-source"><b>Sources:</b> Delta Diablo emails with AVAIO and its engineers, 2024 and 2026; recycled water service agreement; 2019 Pittsburg Technology Park agreement (Operating Memorandum No. 1); settlement agreement.</p><p class="ph-credit">Graphic by Maximus Kwan / Scot Scoop</p></figcaption>
  </figure>
