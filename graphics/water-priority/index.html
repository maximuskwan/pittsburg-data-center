    <h3 class="ph-hed" id="hed">Last in line for recycled water</h3>
    <p class="ph-dek">AVAIO would be the last customer to come online for Delta Diablo’s recycled water, so it would be the first cut off when supply runs short.</p>
    <div class="ph-body" aria-hidden="true"></div>
    <p class="ph-sr-only ph-desc" id="desc">Diagram of who gets Delta Diablo’s recycled water first. Two Calpine power plants have first rights. Other customers share what is left. AVAIO’s data center, the last customer to come online, would be the first to be curtailed. Shortages come on a handful of the hottest summer days, when the cooling system would use the most water. If AVAIO is cut off, the site’s old storage tank holds about 15 days’ supply and is plumbed for drinking water too, and under a 2019 agreement the city promised to find water elsewhere: another district’s recycled water, then raw canal water, then its own municipal supply. The settlement’s 100% recycled water rule applies “absent a disruption” in supply.</p>
    <figcaption class="ph-source">Sources: Delta Diablo emails with AVAIO and its engineers, 2024 and 2026; recycled water service agreement; 2019 Pittsburg Technology Park agreement (Operating Memorandum No. 1); settlement agreement</figcaption>
  </figure>
