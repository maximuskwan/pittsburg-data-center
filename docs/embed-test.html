<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embed test</title>
  <style>
    body { margin: 0; font: 19px/1.6 Georgia, serif; color: #222; background: #fff; }
    .col { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    .bar { background: #8b1a1a; color: #fff; font: 600 15px system-ui; padding: 14px 16px; }
  </style>
</head>
<body>
  <!-- Simulates a host article page (Scot Scoop / a republisher) embedding the interactive.
       Open http://localhost:8080/docs/embed-test.html while `npm start` is running. -->
  <div class="bar">Host site header (simulated)</div>
  <div class="col"><p>Article text above the embed. Scroll down into the interactive; when it ends, the page continues.</p></div>

  <iframe src="../index.html"
          title="Interactive map: from the national data center boom to one Pittsburg golf course"
          style="width:100%;height:100vh;border:0;display:block"
          loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <p class="col" style="padding-top:8px;padding-bottom:0;font:14px system-ui"><a href="../index.html">View the interactive full-screen →</a></p>

  <div class="col">
    <p>Article text below the embed. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <p>More article text.</p>
  </div>
</body>
</html>
